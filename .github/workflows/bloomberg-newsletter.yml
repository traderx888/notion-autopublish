name: Bloomberg Newsletter Pipeline

on:
  workflow_dispatch:
  schedule:
    # Every 3 days at 09:00 HKT (01:00 UTC)
    - cron: "0 1 */3 * *"
    # Sunday weekly digest at 10:00 HKT (02:00 UTC)
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  newsletter-pipeline:
    runs-on: [self-hosted, windows, x64, notion-autopublish]
    env:
      CODEX_NEWSLETTER_MODEL: gpt-5.6-sol
      CODEX_NEWSLETTER_TIMEOUT_SECONDS: "600"
      PYTHON_BOOTSTRAP: C:\Users\user\.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare isolated Python
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath $env:PYTHON_BOOTSTRAP)) {
            throw "Required Python runtime not found: $env:PYTHON_BOOTSTRAP"
          }
          $venvDir = Join-Path $env:RUNNER_TEMP "bloomberg-newsletter-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $env:PYTHON_BOOTSTRAP -m venv $venvDir
          $python = Join-Path $venvDir "Scripts\python.exe"
          & $python --version
          "PYTHON_BIN=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify Codex CLI
        shell: powershell
        run: |
          npm install --global @openai/codex@0.154.0
          codex --version

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:PYTHON_BIN -m pip install --upgrade pip
          & $env:PYTHON_BIN -m pip install "pypdf>=4.0.0" "beautifulsoup4>=4.12.0" pytest

      - name: Convert new PDFs to markdown
        shell: powershell
        run: |
          & $env:PYTHON_BIN tools/bloomberg_pdf_convert.py --days 28

      - name: Build weekly digest (Sunday only)
        shell: powershell
        run: |
          $dow = (Get-Date).DayOfWeek
          if ($dow -eq 'Sunday') {
            Write-Host "Sunday — generating weekly digest"
            & $env:PYTHON_BIN tools/bloomberg_weekly_digest.py
          } else {
            Write-Host "Not Sunday ($dow) — skipping weekly digest"
          }

      - name: Build newsletter from new articles
        shell: powershell
        run: |
          & $env:PYTHON_BIN tools/bloomberg_newsletter_build.py

      - name: Run pipeline tests
        shell: powershell
        run: |
          & $env:PYTHON_BIN -m pytest tests/test_bloomberg_pipeline.py -q

      - name: Commit and push
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/newsletter_*.html output/student.html
          git add outputs/ops/bloomberg_pipeline_state.json
          if (git diff --cached --quiet) {
            Write-Host "No new newsletter changes to commit."
            exit 0
          }
          git commit -m "Auto-generate Bloomberg newsletter"
          git push origin HEAD:main
